<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClauseGuard - Analysis Results v0</title>

    <!-- Fonts: Inter Tight (Display), Inter (Body), JetBrains Mono (Tech/Meta) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (Pinned CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Tailwind Config for Linear-style Design System -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['"Inter Tight"', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        ground: '#08090A',
                        surface1: '#16171C',
                        surface2: '#1E1F25',
                        surface3: '#26272E',
                        accent: '#5E6AD2',
                        textPrimary: '#F7F8F8',
                        textSecondary: '#9CA3AF',
                        textMuted: '#6B7280',
                        hairline: 'rgba(255, 255, 255, 0.06)',
                        // Semantic risk colors
                        riskHigh: '#EF4444',
                        riskMedium: '#F59E0B',
                        riskLow: '#10B981',
                    },
                    boxShadow: {
                        'soft': '0 1px 2px rgba(0, 0, 0, 0.3)',
                    },
                    borderRadius: {
                        'md': '6px',
                        'lg': '12px',
                        'xl': '16px',
                    }
                }
            }
        }
    </script>

    <!-- Base UI CSS Variables & Utilities -->
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            background-color: theme('colors.ground');
            color: theme('colors.textPrimary');
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /*
         * Motion & Interaction Primitives (Apple + Linear Philosophy)
         * - Snappy release, interruptible
         * - Scale down on press (feedback)
         */
        .tap-target {
            transition: transform 150ms cubic-bezier(0.23, 1, 0.32, 1), background-color 150ms ease;
            cursor: pointer;
            /* Mobile tap highlight reset */
            -webkit-tap-highlight-color: transparent;
        }

        .tap-target:active {
            transform: scale(0.97);
            background-color: theme('colors.surface2');
        }

        /* Blur glassmorphism for sticky header */
        .glass-header {
            background-color: rgba(8, 9, 10, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid theme('colors.hairline');
        }

        /* Mobile Frame Container (to simulate phone on desktop) */
        .mobile-frame {
            width: 100%;
            max-width: 400px; /* iPhone Pro Max width approx */
            height: 100vh;
            max-height: 850px;
            margin: 0 auto;
            position: relative;
            overflow: hidden;
            background-color: theme('colors.ground');
            border-left: 1px solid theme('colors.hairline');
            border-right: 1px solid theme('colors.hairline');
            display: flex;
            flex-direction: column;
        }

        @media (min-width: 640px) {
            body {
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                background-color: #000;
            }
            .mobile-frame {
                height: 850px;
                border: 1px solid theme('colors.hairline');
                border-radius: 32px;
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            }
        }

        /* Scrollbar hiding */
        .hide-scroll::-webkit-scrollbar {
            display: none;
        }
        .hide-scroll {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- Mock Data ---
        // Matches the ContractUiState / AnalysisResult schema from the backend
        const MOCK_CONTRACT = {
            id: "d4e1d7f0e7a7e4c3b2",
            filename: "MSA_AcmeCorp_2026_Final.pdf",
            riskScore: 78, // High risk
            clauses: [
                {
                    id: "c1",
                    clauseNumber: 4,
                    category: "Indemnification",
                    riskLevel: "HIGH",
                    originalText: "Client shall indemnify and hold harmless the Provider against any and all claims, damages, liabilities, costs, and expenses (including reasonable attorneys' fees) arising out of or related to the Client's use of the Services, regardless of Provider's own negligence.",
                    explanation: "This is a broad, unilateral indemnification clause that forces you to cover costs even if the Provider is at fault.",
                    negotiationStrategy: "Require mutual indemnification and carve out exceptions for Provider's gross negligence or willful misconduct."
                },
                {
                    id: "c2",
                    clauseNumber: 9,
                    category: "Termination for Convenience",
                    riskLevel: "MEDIUM",
                    originalText: "Provider may terminate this Agreement at any time for any reason upon thirty (30) days prior written notice to Client. Client may only terminate for material breach.",
                    explanation: "The termination rights are asymmetrical. The Provider can walk away easily, while you are locked in unless they breach the contract.",
                    negotiationStrategy: "Request mutual termination for convenience rights, or increase the notice period for Provider termination to 90 days to allow for transition."
                },
                {
                    id: "c3",
                    clauseNumber: 12,
                    category: "Governing Law",
                    riskLevel: "LOW",
                    originalText: "This Agreement shall be governed by and construed in accordance with the laws of the State of Delaware.",
                    explanation: "Standard governing law clause specifying Delaware jurisdiction, common for corporate agreements.",
                    negotiationStrategy: "Acceptable as is, unless your legal counsel specifically requires your home state jurisdiction."
                }
            ]
        };

        // --- Components ---

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            });
            return <i data-lucide={name} style={{ width: size, height: size }} className={className}></i>;
        };

        const RiskBadge = ({ level }) => {
            const config = {
                HIGH: { color: 'text-riskHigh', bg: 'bg-riskHigh/10', icon: 'alert-triangle' },
                MEDIUM: { color: 'text-riskMedium', bg: 'bg-riskMedium/10', icon: 'alert-circle' },
                LOW: { color: 'text-riskLow', bg: 'bg-riskLow/10', icon: 'check-circle' }
            }[level];

            return (
                <div className={`flex items-center gap-1.5 px-2.5 py-1 rounded-md ${config.bg} ${config.color} text-xs font-mono font-medium border border-current border-opacity-20`}>
                    <Icon name={config.icon} size={12} />
                    {level}
                </div>
            );
        };

        const ClauseCard = ({ clause, isExpanded, onToggle }) => {
            return (
                <div
                    className="tap-target bg-surface1 border border-hairline rounded-lg overflow-hidden mb-4"
                    onClick={onToggle}
                >
                    {/* Header (Always visible) */}
                    <div className="p-4 flex items-start justify-between gap-4">
                        <div className="flex-1">
                            <div className="flex items-center gap-2 mb-1.5">
                                <span className="font-mono text-[10px] text-textMuted bg-surface2 px-1.5 py-0.5 rounded">
                                    § {clause.clauseNumber}
                                </span>
                                <h3 className="font-medium text-textPrimary text-sm">{clause.category}</h3>
                            </div>
                            {/* Snippet (hidden when expanded) */}
                            {!isExpanded && (
                                <p className="text-sm text-textSecondary line-clamp-2 mt-1 leading-relaxed">
                                    {clause.originalText}
                                </p>
                            )}
                        </div>
                        <RiskBadge level={clause.riskLevel} />
                    </div>

                    {/* Expanded Content (Placeholder for v0 - no animation yet) */}
                    {isExpanded && (
                        <div className="px-4 pb-4 border-t border-hairline pt-4 bg-surface1/50">
                            <div className="space-y-4">
                                <div>
                                    <h4 className="text-[11px] uppercase tracking-wider font-semibold text-textMuted mb-1.5">Original Text</h4>
                                    <p className="text-sm text-textSecondary leading-relaxed bg-surface2/50 p-3 rounded-md font-mono text-xs">
                                        {clause.originalText}
                                    </p>
                                </div>
                                <div>
                                    <h4 className="text-[11px] uppercase tracking-wider font-semibold text-textMuted mb-1.5">Plain English Explanation</h4>
                                    <p className="text-sm text-textPrimary leading-relaxed">
                                        {clause.explanation}
                                    </p>
                                </div>
                                <div>
                                    <h4 className="text-[11px] uppercase tracking-wider font-semibold text-accent mb-1.5 flex items-center gap-1.5">
                                        <Icon name="zap" size={12} /> Strategy
                                    </h4>
                                    <div className="bg-accent/10 border border-accent/20 p-3 rounded-md">
                                        <p className="text-sm text-textPrimary leading-relaxed">
                                            {clause.negotiationStrategy}
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AnalysisScreen = () => {
            const [expandedClauseId, setExpandedClauseId] = useState(null);

            // Simple derived color for overall score (high > 70 = red)
            const scoreColorClass = MOCK_CONTRACT.riskScore >= 70 ? 'text-riskHigh' :
                                    MOCK_CONTRACT.riskScore >= 40 ? 'text-riskMedium' : 'text-riskLow';

            return (
                <div className="mobile-frame">

                    {/* Sticky Header / Peak Moment Focus */}
                    <header className="glass-header sticky top-0 z-10 px-4 py-4 pt-12 flex flex-col gap-4">
                        <div className="flex items-center justify-between">
                            <button className="tap-target p-2 -ml-2 text-textSecondary hover:text-textPrimary rounded-full">
                                <Icon name="chevron-left" size={24} />
                            </button>
                            <div className="text-xs font-mono text-textMuted truncate max-w-[200px]">
                                {MOCK_CONTRACT.filename}
                            </div>
                            <button className="tap-target p-2 -mr-2 text-textSecondary hover:text-textPrimary rounded-full">
                                <Icon name="share" size={20} />
                            </button>
                        </div>

                        <div className="flex items-end gap-3 pb-2">
                            <div>
                                <div className="text-xs font-medium text-textMuted uppercase tracking-wider mb-1">Overall Risk</div>
                                <div className={`font-display font-semibold text-5xl leading-none tracking-tight ${scoreColorClass}`}>
                                    {MOCK_CONTRACT.riskScore}
                                </div>
                            </div>
                            <div className="mb-1 text-sm text-textSecondary font-medium">/ 100</div>
                        </div>
                    </header>

                    {/* Scrollable Content */}
                    <main className="flex-1 overflow-y-auto hide-scroll p-4 pb-24">
                        <div className="flex items-center justify-between mb-4 mt-2">
                            <h2 className="text-sm font-medium text-textPrimary">Identified Clauses ({MOCK_CONTRACT.clauses.length})</h2>
                            <button className="text-xs font-medium text-accent">Expand All</button>
                        </div>

                        <div className="space-y-1">
                            {MOCK_CONTRACT.clauses.map(clause => (
                                <ClauseCard
                                    key={clause.id}
                                    clause={clause}
                                    isExpanded={expandedClauseId === clause.id}
                                    onToggle={() => setExpandedClauseId(prev => prev === clause.id ? null : clause.id)}
                                />
                            ))}
                        </div>
                    </main>

                    {/* Bottom Action Bar */}
                    <div className="absolute bottom-0 left-0 right-0 p-4 bg-ground/90 backdrop-blur-md border-t border-hairline">
                        <button className="tap-target w-full bg-accent text-white font-medium py-3.5 px-4 rounded-lg flex items-center justify-center gap-2 shadow-[0_0_15px_rgba(94,106,210,0.3)]">
                            <Icon name="download" size={18} />
                            Export Summary PDF
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<AnalysisScreen />);
    </script>
</body>
</html>
